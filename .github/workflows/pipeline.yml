name: Pipeline DevSecOps

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias
        run: pip install -r requirements.txt

  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Permite a Sonar comentar en los pull requests si es necesario
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Análisis Estático con SonarQube Cloud
        uses: sonarsource/sonarqube-scan-action@v5.0.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    
    sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Escaneo de dependencias con Snyk
        uses: snyk/actions/python@master
        continue-on-error: true # Mantiene el pipeline en verde para el laboratorio
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
